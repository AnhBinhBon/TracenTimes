<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#141824" rx="20"/>
  <g transform="translate(60, 45)" stroke="#f1f5f9" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Frame -->
    <path d="M 40 40 L 220 40" />
    <path d="M 40 40 L 40 280 L 290 280 L 290 140" />
    
    <!-- Sun -->
