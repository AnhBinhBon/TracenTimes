    <path d="M 160 200 L 220 130 L 285 270" />
    
    <!-- Warning Circle -->
    <circle cx="290" cy="50" r="55" stroke="#f1f5f9" stroke-width="16" fill="#141824" />
    <line x1="290" y1="20" x2="290" y2="55" stroke="#f1f5f9" stroke-width="16" />
    <circle cx="290" cy="80" r="8" fill="#f1f5f9" stroke="none" />
  </g>
  <text x="250" y="420" font-family="'Outfit', -apple-system, sans-serif" font-size="44" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="2">Error</text>
</svg>
